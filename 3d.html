<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Interactive Blocks</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; }
        #instructions {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: sans-serif;
            pointer-events: none;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="instructions">
        <strong>Controls:</strong><br>
        • Left Click + Drag: Move Blocks<br>
        • Right Click + Drag: Rotate Camera<br>
        • Scroll: Zoom In/Out
    </div>

    <!-- Import Three.js and its controls from a CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com",
                "three/addons/": "https://unpkg.com"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { DragControls } from 'three/addons/controls/DragControls.js';

        // 1. Setup Scene, Camera, and Renderer
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Add Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 7);
        scene.add(directionalLight);

        // 3. Create 3 Colored Blocks
        const objects = [];
        const geometry = new THREE.BoxGeometry(2, 2, 2);
        const colors = [0xff4444, 0x44ff44, 0x4444ff]; // Red, Green, Blue
        const positions = [[-4, 1, 0], [0, 1, 0], [4, 1, 0]];

        colors.forEach((color, i) => {
            const material = new THREE.MeshPhongMaterial({ color });
            const block = new THREE.Mesh(geometry, material);
            block.position.set(...positions[i]);
            scene.add(block);
            objects.push(block); // Add to array for DragControls
        });

        // Add a grid floor for perspective
        const grid = new THREE.GridHelper(20, 20);
        scene.add(grid);

        // 4. Initialize Controls
        const orbit = new OrbitControls(camera, renderer.domElement);
        orbit.mouseButtons = { LEFT: null, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };

        const drag = new DragControls(objects, camera, renderer.domElement);

        // Disable camera rotation while dragging an object
        drag.addEventListener('dragstart', () => orbit.enabled = false);
        drag.addEventListener('dragend', () => orbit.enabled = true);

        // 5. Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            orbit.update();
            renderer.render(scene, camera);
        }

        // Handle window resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
