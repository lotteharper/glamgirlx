<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Crop Upper-Left Square → 3000×3000</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; margin: 24px; color: #111; }
    .controls { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:18px; }
    label { display:inline-flex; gap:8px; align-items:center; }
    canvas { background:#f6f6f6; border:1px solid #ddd; width:500px; height:500px; object-fit:contain; }
    .info { font-size:0.95rem; color:#444; }
    button[disabled] { opacity:0.45; cursor:not-allowed; }
  </style>
</head>
<body>
  <h1>Crop the upper-left square and export at 3000×3000</h1>

  <div class="controls">
    <label>
      Choose image
      <input id="fileInput" type="file" accept="image/*" />
    </label>

    <button id="downloadBtn" disabled>Download PNG (3000×3000)</button>

    <div class="info" id="status">No image loaded.</div>
  </div>

  <!-- Canvas: actual backing resolution will be 3000×3000, CSS scales for preview -->
  <canvas id="preview" width="3000" height="3000" aria-label="Cropped image preview"></canvas>

  <script>
    (function () {
      const fileInput = document.getElementById('fileInput');
      const downloadBtn = document.getElementById('downloadBtn');
      const status = document.getElementById('status');
      const preview = document.getElementById('preview');
      const PREVIEW_CSS_SIZE = 500; // CSS preview size (square). The real canvas stays 3000x3000.

      // Scale down the visible canvas using CSS while keeping actual resolution 3000x3000.
      preview.style.width = PREVIEW_CSS_SIZE + 'px';
      preview.style.height = PREVIEW_CSS_SIZE + 'px';

      let lastFilename = 'cropped-upper-left-3000.png';
      let loaded = false;

      function setStatus(text) {
        status.textContent = text;
      }

      fileInput.addEventListener('change', async (ev) => {
        const file = ev.target.files && ev.target.files[0];
        if (!file) {
          setStatus('No image selected.');
          downloadBtn.disabled = true;
          loaded = false;
          return;
        }

        // Basic file type check
        if (!file.type.startsWith('image/')) {
          setStatus('Selected file is not an image.');
          downloadBtn.disabled = true;
          loaded = false;
          return;
        }

        setStatus('Loading image...');
        lastFilename = file.name ? file.name.replace(/\.[^.]+$/, '') + '-upper-left-3000.png' : lastFilename;

        try {
          const imgURL = await readFileAsDataURL(file);
          const img = await loadImage(imgURL);

          // Determine the largest possible square anchored at top-left (0,0)
          const cropSize = Math.min(img.width, img.height);

          // Draw to canvas at 3000 x 3000
          const targetSize = 3000;
          const ctx = preview.getContext('2d', { alpha: true });

          // Clear canvas
          ctx.clearRect(0, 0, preview.width, preview.height);

          // Important: ensure canvas backing size is exactly 3000x3000
          if (preview.width !== targetSize || preview.height !== targetSize) {
            preview.width = targetSize;
            preview.height = targetSize;
          }

          // Draw the crop from (0,0) of size cropSize into full canvas
          // drawImage(image, sx, sy, sWidth, sHeight, dx, dy, dWidth, dHeight)
          ctx.drawImage(img, 0, 0, cropSize, cropSize, 0, 0, targetSize, targetSize);

          setStatus(`Cropped ${cropSize}×${cropSize} from upper-left of source image (${img.width}×${img.height}), exported to ${targetSize}×${targetSize}.`);
          downloadBtn.disabled = false;
          loaded = true;
        } catch (err) {
          console.error(err);
          setStatus('Failed to load or process image.');
          downloadBtn.disabled = true;
          loaded = false;
        }
      });

      downloadBtn.addEventListener('click', () => {
        if (!loaded) return;
        setStatus('Preparing file for download...');
        // Use toBlob for better memory handling than toDataURL for large canvases
        preview.toBlob((blob) => {
          if (!blob) {
            setStatus('Could not generate image blob.');
            return;
          }
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = lastFilename;
          document.body.appendChild(a);
          a.click();
          a.remove();
          // Revoke after short delay to ensure download started
          setTimeout(() => URL.revokeObjectURL(url), 2000);
          setStatus('Download started.');
        }, 'image/png');
      });

      // Helpers
      function readFileAsDataURL(file) {
        return new Promise((resolve, reject) => {
          const fr = new FileReader();
          fr.onerror = () => {
            fr.abort();
            reject(new Error('File read error'));
          };
          fr.onload = () => resolve(fr.result);
          fr.readAsDataURL(file);
        });
      }

      function loadImage(dataURL) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          // Avoid potential CORS tainting when user-provided data URL used; not an issue here but keep crossOrigin unset.
          img.onload = () => resolve(img);
          img.onerror = (e) => reject(new Error('Image load error'));
          img.src = dataURL;
        });
      }

      // Accessibility: support Enter/Space to trigger file dialog when pressing label
      // (Most browsers already do this; no extra code needed.)
    })();
  </script>
</body>
</html>
